    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1a3969" fill-opacity="0.12"/>
    </pattern>
    <!-- Voile central : garde la zone du texte lisible, les illustrations restent aux extremites -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fbfcfe" stop-opacity="0.10"/>
