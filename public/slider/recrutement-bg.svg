  <defs>
    <!-- Fond identique au degrade de la diapositive (couleurs background et surface) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="1480" cy="80" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ab8de" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5ab8de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="90" cy="440" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a3969" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1a3969" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1a3969" fill-opacity="0.12"/>
    </pattern>
    <!-- Voile central : garde la zone du texte lisible, les illustrations restent aux extremites -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fbfcfe" stop-opacity="0.10"/>
      <stop offset="0.10" stop-color="#fbfcfe" stop-opacity="0.45"/>
      <stop offset="0.24" stop-color="#fbfcfe" stop-opacity="0.94"/>
      <stop offset="0.76" stop-color="#fbfcfe" stop-opacity="0.94"/>
      <stop offset="0.90" stop-color="#fbfcfe" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#fbfcfe" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glowRight)"/>
  <rect width="1600" height="500" fill="url(#glowLeft)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>

